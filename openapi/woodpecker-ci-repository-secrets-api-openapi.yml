openapi: 3.2.0
info:
  description: 'Woodpecker is a simple, yet powerful CI/CD engine with great extensibility.

    To get a personal access token (PAT) for authentication, please log in your Woodpecker server,

    and go to you personal profile page, by clicking the user icon at the top right.'
  title: Woodpecker CI Repository secrets API
  contact:
    name: Woodpecker CI
    url: https://woodpecker-ci.org/
  version: next-a4cb541b82
servers:
- url: https://ci.woodpecker-ci.org/api
tags:
- name: Repository secrets
paths:
  /repos/{repo_id}/secrets:
    get:
      tags:
      - Repository secrets
      summary: List repository secrets
      parameters:
      - description: Insert your personal access token
        name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: Bearer <personal access token>
      - description: the repository id
        name: repo_id
        in: path
        required: true
        schema:
          type: integer
      - description: for response pagination, page offset number
        name: page
        in: query
        schema:
          type: integer
          default: 1
      - description: for response pagination, max items per page
        name: perPage
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
      operationId: getReposByRepoIdSecrets
      x-operation-id-source: derived
    post:
      tags:
      - Repository secrets
      summary: Create a repository secret
      parameters:
      - description: Insert your personal access token
        name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: Bearer <personal access token>
      - description: the repository id
        name: repo_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
        description: the new secret
        required: true
      operationId: postReposByRepoIdSecrets
      x-operation-id-source: derived
  /repos/{repo_id}/secrets/{secretName}:
    get:
      tags:
      - Repository secrets
      summary: Get a repository secret by name
      parameters:
      - description: Insert your personal access token
        name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: Bearer <personal access token>
      - description: the repository id
        name: repo_id
        in: path
        required: true
        schema:
          type: integer
      - description: the secret name
        name: secretName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
      operationId: getReposByRepoIdSecretsBySecretName
      x-operation-id-source: derived
    delete:
      tags:
      - Repository secrets
      summary: Delete a repository secret by name
      parameters:
      - description: Insert your personal access token
        name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: Bearer <personal access token>
      - description: the repository id
        name: repo_id
        in: path
        required: true
        schema:
          type: integer
      - description: the secret name
        name: secretName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      operationId: deleteReposByRepoIdSecretsBySecretName
      x-operation-id-source: derived
    patch:
      tags:
      - Repository secrets
      summary: Update a repository secret by name
      parameters:
      - description: Insert your personal access token
        name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: Bearer <personal access token>
      - description: the repository id
        name: repo_id
        in: path
        required: true
        schema:
          type: integer
      - description: the secret name
        name: secretName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretPatch'
        description: the secret itself
        required: true
      operationId: patchReposByRepoIdSecretsBySecretName
      x-operation-id-source: derived
components:
  schemas:
    SecretPatch:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        images:
          type: array
          items:
            type: string
        name:
          type: string
        note:
          type: string
        value:
          type: string
    WebhookEvent:
      type: string
      enum:
      - push
      - pull_request
      - pull_request_closed
      - pull_request_metadata
      - tag
      - release
      - deployment
      - cron
      - manual
      x-enum-varnames:
      - EventPush
      - EventPull
      - EventPullClosed
      - EventPullMetadata
      - EventTag
      - EventRelease
      - EventDeploy
      - EventCron
      - EventManual
    Secret:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        id:
          type: integer
        images:
          type: array
          items:
            type: string
        name:
          type: string
        note:
          type: string
        org_id:
          type: integer
        repo_id:
          type: integer
        value:
          type: string
