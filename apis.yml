aid: woodpecker-ci
name: Woodpecker CI
description: 'Woodpecker CI is a free, open-source (Apache-2.0) continuous integration
  and delivery engine, forked from Drone and maintained by a community organization
  on GitHub. It is self-hosted: an operator runs a Woodpecker server plus one or more
  agents (Docker, Kubernetes, or local backends) against a Git forge — GitHub, GitLab,
  Gitea, Forgejo, or Bitbucket. Pipelines are declared in `.woodpecker/` YAML workflow
  files validated by a published JSON Schema, and every server exposes a documented
  Swagger 2.0 REST API under /api covering repositories, pipelines, secrets, registries,
  crons, agents, forges, orgs and users, plus Server-Sent Event streams for pipeline
  events and step logs. Agents talk to the server over a published gRPC/protobuf contract.
  A first-party Go client library (woodpecker-go), a woodpecker-cli command line tool,
  DEB/RPM packages, container images and a Helm chart are all published by the project.'
url: https://raw.githubusercontent.com/api-evangelist/woodpecker-ci/refs/heads/main/apis.yml
image: https://woodpecker-ci.org/img/logo.svg
x-type: company
