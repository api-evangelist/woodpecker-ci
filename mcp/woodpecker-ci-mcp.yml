summary: >-
  Woodpecker CI does not ship an MCP server. There is no repository named for MCP in the
  woodpecker-ci GitHub organization, no hosted MCP endpoint, and no MCP page in the docs.
  The project DOES link one community server from its own Awesome page, and several more
  exist on GitHub and npm; none of them is published by the project, so no MCPServer
  pointer is wired into apis.yml. Emitting one would assert that the provider serves an
  agent surface it does not serve.
