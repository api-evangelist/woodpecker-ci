scope_note: >-
  Woodpecker publishes no MCP server of its own. This crosswalk binds the tools of the ONE
  community server the project links from its own Awesome page
  (https://github.com/j04n-f/woodpecker-mcp) to the REST operations they must be calling,
  so the divergence between the agent surface people actually use and the API the project
  actually ships is recorded rather than assumed. It does not assert that Woodpecker ships
  an MCP server.
