mcp_only_note: >-
  Every published tool binds to a real REST operation. The community server adds no
  composite or MCP-native capability; it adds one prompt (`review-pipeline-error`), which is
  a prompt rather than a tool and has no REST counterpart by construction.
rest_only:
  count: 112
  note: >-
    112 of the 118 REST operations have no tool. The gap is not incidental — it is the
    entire write surface and the entire administrative surface.
  categories:
  - name: Pipeline control (write)
    operations:
    - 'POST /repos/{repo_id}/pipelines — Trigger a manual pipeline'
    - 'POST /repos/{repo_id}/pipelines/{pipeline_number} — Restart a pipeline'
    - 'POST /repos/{repo_id}/pipelines/{pipeline_number}/approve'
    - 'POST /repos/{repo_id}/pipelines/{pipeline_number}/decline'
    - 'POST /repos/{repo_id}/pipelines/{pipeline_number}/cancel'
    - 'DELETE /repos/{repo_id}/pipelines/{pipeline_number}'
  - name: Secrets and registries (all three scopes)
    operations:
    - 'GET|POST /secrets, /orgs/{org_id}/secrets, /repos/{repo_id}/secrets and their item operations'
    - 'GET|POST /registries, /orgs/{org_id}/registries, /repos/{repo_id}/registries and their item operations'
    note: >-
      Deliberately absent from the agent surface, and rightly so — Secret carries a `value`
      field and Registry carries a `password` field.
  - name: Repository administration
    operations:
    - 'POST /repos — Activate a repository'
    - 'PATCH|DELETE /repos/{repo_id}'
    - 'POST /repos/{repo_id}/repair, /repos/repair, /repos/{repo_id}/chown, /repos/{repo_id}/move'
  - name: Cron jobs
    operations: ['GET|POST /repos/{repo_id}/cron', 'GET|POST|PATCH|DELETE /repos/{repo_id}/cron/{cron}']
  - name: Agents, forges, users, orgs
    operations:
    - '/agents and /orgs/{org_id}/agents (list, create, update, delete)'
    - '/forges and /forges/{forge_id}'
    - '/users and /users/{login}'
    - '/orgs, /orgs/{org_id}, /orgs/lookup/{org_full_name}'
  - name: Queue administration
    operations: ['GET /queue/info', 'POST /queue/pause', 'POST /queue/resume', 'GET /queue/norunningpipelines', 'GET /pipelines']
  - name: Streaming
    operations: ['GET /stream/events', 'GET /stream/logs/{repo_id}/{pipeline}/{step_id}']
