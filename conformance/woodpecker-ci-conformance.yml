domain_standards:
- id: cctray
  name: CCTray / CruiseControl cc.xml project status format
  conforms: true
  market: continuous integration
  evidence: >-
    GET /badges/{repo_id}/cc.xml — "Provide pipeline status information to the CCMenu
    tool" — declared in openapi/woodpecker-ci-server-swagger.json under the Badges tag,
    produces text/xml. This is the long-standing de-facto CI build-status feed consumed
    by CCMenu, CCTray and build-light hardware, so an existing CI dashboard integrates
    with Woodpecker with no bespoke connector.
  spec_location: 'paths./badges/{repo_id}/cc.xml.get'
