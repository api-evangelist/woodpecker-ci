- id: prometheus
  conforms: true
  evidence: >-
    The server exposes a Prometheus text-exposition `/metrics` endpoint, documented at
    https://woodpecker-ci.org/docs/administration/configuration/server: "Woodpecker is
    compatible with Prometheus and exposes a /metrics endpoint if the environment variable
    WOODPECKER_PROMETHEUS_AUTH_TOKEN is set", scraped with that token as a bearer. The docs
    publish the Woodpecker-specific metric names (woodpecker_pipeline_count,
    woodpecker_pipeline_time and others). It is OFF by default and token-gated, which is why
    https://ci.woodpecker-ci.org/metrics returned 404 when probed on 2026-08-27 — an
    operator opt-in, not an absence.
  note: >-
    The /metrics endpoint is NOT described in the Swagger document; it is documented only in
