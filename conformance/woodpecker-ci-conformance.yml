    at https://ci.woodpecker-ci.org/swagger/doc.json.
- id: swagger2
  conforms: true
  evidence: >-
    Valid Swagger 2.0 document: swagger 2.0, host ci.woodpecker-ci.org, basePath /api,
    74 paths, 118 operations, 51 definitions. Rendered by the project at
    https://woodpecker-ci.org/api.
- id: json-schema
  conforms: true
  version: draft-07
  evidence: >-
    json-schema/woodpecker-ci-pipeline-schema.json declares
    "$schema": "http://json-schema.org/draft-07/schema#" and
    "$id": "https://raw.githubusercontent.com/woodpecker-ci/woodpecker/main/pipeline/frontend/yaml/linter/schema/schema.json".
