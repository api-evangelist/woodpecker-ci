- id: grpc
  conforms: true
  evidence: >-
    Agents connect to the server over gRPC; the generated stubs (woodpecker_grpc.pb.go)
    ship in the same repository, and 3.18.0 added rejection of agents running an
    incompatible gRPC proto version.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are `text/plain` strings or empty bodies. No application/problem+json anywhere
    in the spec or on observed live responses. See errors/woodpecker-ci-problem-types.yml.
- id: pagination
  conforms: true
  style: page-number
  evidence: >-
    `page` (default 1) and `perPage` (default 50) query parameters on 16 collection
    operations, documented as a project convention at
    https://woodpecker-ci.org/docs/development/openapi. Responses are bare arrays with no
    total or link envelope.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header, no idempotency documentation, zero occurrences of
