- id: semver
  conforms: true
  evidence: >-
    Releases follow MAJOR.MINOR.PATCH with release candidates (v3.18.0, v3.14.0-rc.2),
    and the deprecation policy is expressed in terms of the semver cycle.
- id: rfc8594
  conforms: false
  evidence: >-
    No Sunset or Deprecation response headers. Deprecations are published on
