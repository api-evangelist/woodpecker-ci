deprecation_policy:
  published: true
  url: https://woodpecker-ci.org/docs/development/deprecations
  scope: >-
    The written policy governs pipeline configuration (YAML) syntax. The same
    major-version cadence is applied to API model changes, which are announced on the
    migrations page.
  process:
  - stage: 'Minor version N.x'
    behaviour: >-
      Linter shows a WARNING, not an error. The old syntax remains functional and the
      documentation is updated to the new syntax. The warning message includes guidance
      on the required change.
  - stage: 'Major version (N+1).0'
    behaviour: >-
      The warning becomes an ERROR — the pipeline fails. The old syntax is no longer
      supported and the breaking change is documented in the migration guide.
  - stage: 'Minor version (N+1).x'
    behaviour: >-
      Deprecated code paths are removed and the parser no longer recognises the old
      syntax.
  worked_example: >-
    `secrets: [token]` was deprecated with a linter warning in v2.5.0, kept working
    through v2.6–v2.9, became a linter error in v3.0.0, and had its code path removed in
    v3.1.0 — a full major cycle of runway.
  sunset_headers: false
  sunset_header_note: >-
    No RFC 8594 Sunset or Deprecation response headers are emitted; deprecation is
    communicated in the linter, the docs and the migration guide, not on the wire.
migration_guide:
  url: https://woodpecker-ci.org/migrations
  api_deprecations_announced:
  - change: >-
      The Pipeline model is moving to nested objects grouped by event. `title` is
      deprecated in favour of `release.title` (release events); `message` in favour of
      `tag_title` (tag events); `is_prerelease` in favour of `release.is_prerelease`;
      deriving the tag from `ref` in favour of `tag_title`.
    status: announced-for-next
    source: https://woodpecker-ci.org/migrations
  - change: >-
      Already applied in the 3.x line: `sender` replaced by `cron` for cron events, as
      part of the same nested-Pipeline-model migration.
    status: applied
    source: https://woodpecker-ci.org/migrations
  - change: >-
      Environment variables `CI_COMMIT_AUTHOR_AVATAR` / `CI_PREV_COMMIT_AUTHOR_AVATAR`
      deprecated in favour of `CI_PIPELINE_AVATAR` / `CI_PREV_PIPELINE_AVATAR`;
      `CI_COMMIT_PRERELEASE` in favour of `CI_PIPELINE_RELEASE_PRE`; the `runs_on`
      workflow property in favour of `when.status`.
    status: announced-for-next
    source: https://woodpecker-ci.org/migrations
deprecated_operations_in_spec: []
deprecated_operations_note: >-
  No operation in openapi/woodpecker-ci-server-swagger.json carries `deprecated: true`.
  The deprecations that exist are at the MODEL/property level and are published on the
  migrations page rather than marked in the contract, so a client generated from the
  spec gets no deprecation signal.
