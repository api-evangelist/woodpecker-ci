overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Woodpecker CI Server API
  version: 1.0.0
extends: openapi/woodpecker-ci-server-swagger.json
x-generated: '2026-08-27'
x-method: generated
x-source: openapi/woodpecker-ci-server-swagger.json (Swagger 2.0, fetched from https://ci.woodpecker-ci.org/swagger/doc.json
  on 2026-08-27)
x-note: These are API Evangelist ADDITIONS layered over the provider spec; the original in openapi/ is
  never mutated. Nothing here changes behaviour or invents an endpoint — it declares the credential the
  operations already require, names the operations the spec left unnamed, and links the project docs.
  operationIds are derived deterministically from each operation summary; they are ours, not the provider's.
actions:
- target: $
  description: Declare the personal-access-token bearer credential as a reusable Swagger 2.0 security
    definition. The published spec expresses it only as a required Authorization header parameter on 110
    of 118 operations, so generated clients get no auth model at all.
  update:
    securityDefinitions:
      PersonalAccessToken:
        type: apiKey
        name: Authorization
        in: header
        description: Woodpecker personal access token, sent as "Bearer <personal access token>". Obtain
          it from your profile page on your own Woodpecker server.
- target: $
  description: Apply the credential globally. Individual unauthenticated operations (/version, /healthz,
    /signature/public-key, the badge endpoints and /hook) override it with an empty security requirement.
  update:
    security:
    - PersonalAccessToken: []
- target: $.info
  description: Add the project contact email and a link to the rendered API reference.
  update:
    contact:
      name: Woodpecker CI
      url: https://woodpecker-ci.org/
      email: security@woodpecker-ci.org
    license:
      name: Apache-2.0
      url: https://github.com/woodpecker-ci/woodpecker/blob/main/LICENSE
- target: $
  description: Point at the rendered reference and the deprecation policy.
  update:
    externalDocs:
      description: Woodpecker CI API reference and documentation
      url: https://woodpecker-ci.org/api
